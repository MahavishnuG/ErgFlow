              get: function() { return activeFetch; },
              set: function(v) { activeFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
          if (typeof window.Window !== 'undefined' && window.Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
            if (protoDesc && protoDesc.configurable && !protoDesc.set) {

                get: function() { return activeFetch; },
